[theme]
primaryColor = "#F34B18"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f7f5"
textColor = "#101010"
font = "sans serif"
dataframeHeaderBackgroundColor = "#edf0f3"
dataframeHeaderTextColor = "#36424f"
dataframeBorderColor = "#e6e9ed"
[browser]
gatherUsageStats = false
[server]
address = "127.0.0.1"
headless = true

enableCORS = true
enableXsrfProtection = true
enableStaticServing = false

[client]
showErrorDetails = "none"
